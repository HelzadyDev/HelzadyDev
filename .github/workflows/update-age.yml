name: Update age in README

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia 03:00 UTC (ajuste se quiser)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update age
        env:
          BIRTHDATE: "2000-02-13"  # <-- TROQUE pela sua data (AAAA-MM-DD)
        run: |
          python - << 'PY'
          import os, re
          from datetime import date, datetime

          birth = datetime.strptime(os.environ["BIRTHDATE"], "%Y-%m-%d").date()
          today = date.today()

          age = today.year - birth.year - ((today.month, today.day) < (birth.month, birth.day))

          path = "README.md"
          with open(path, "r", encoding="utf-8") as f:
            s = f.read()

          new = re.sub(r"<!--AGE-->.*?<!--/AGE-->", f"<!--AGE-->{age}<!--/AGE-->", s, flags=re.S)

          if new != s:
            with open(path, "w", encoding="utf-8") as f:
              f.write(new)
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update age"
          git push
